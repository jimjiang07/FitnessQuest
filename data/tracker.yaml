# Gym tracker: what the Habits, Upper, Lower and Body tabs show. Edit here, not in code.
# Safety cues are written for L4/L5 + L5/S1 disc protrusion and sensitive neck facet joints.

weeklyTarget: 3          # sessions a week for "Target achieved"
weeksShown: 52           # the habit wall shows at least this many weeks, more once you pass it

profile:
  lumbar: "L4/L5 and L5/S1 disc degeneration and protrusion. No axial loading (standing heavy squats or deadlifts), no unsupported hip hinging (bent-over rows), no fast twisting (boxing, badminton, swings) and no hard landings."
  cervical: "Sensitive neck facet joints. Don't tip your head back: no cobra or swan head lifts, no looking up at a screen on the bike or rower. Keep a gentle chin tuck and a neutral neck."
  goals:
    - Lose 6.9 kg of fat to 11–12% body fat, keeping the muscle
    - Visible abs and a V-taper (wider shoulders, narrower waist)
    - Sharper shoulders, upper chest and arms
    - Rebuild deep core stability
    - Build strength on supported machines
    - Keep the spine decompressed

# The weekly plan, shown on the habit wall. Monday is first.
week:
  - { day: Mon, plan: "Pilates (noon) + swim (evening)", note: "Draw your navel in through the whole class." }
  - { day: Tue, plan: "Upper definition + 20 min incline walk", note: "About 45 minutes. Arms superset at the end, then plank and walk." }
  - { day: Wed, plan: Rest, note: "8,000 steps of easy walking." }
  - { day: Thu, plan: "Pilates (noon) + swim (evening)", note: "Active recovery and decompression." }
  - { day: Fri, plan: "Lower strength + 25 min cardio" }
  - { day: Sat, plan: "Saturday burn (2–3 pm)", note: "25 min steady cardio + 20 min swim and spa: about 250 active calories." }
  - { day: Sun, plan: Rest, note: "Full recovery." }

# The cut: a slow fat loss that keeps the muscle. Weigh in fasted 2–3 mornings a week; the Body tab goes by the weekly average.
cut:
  start: 75.4
  from: 2026-11-12
  target: 68.5
  by: Late Feb 2027
  pace: 0.45–0.5 kg a week, about a 500 kcal daily deficit
  nutrition:
    kcal: 1850
    protein: 150
    fat: 50
    carbs: 200
    note: "Protein over 3–4 meals, 35–40 g each. Most of the carbs (rice, oats, potatoes) go in the meals before and after the gym."
  milestones:
    - { date: 2026-12-10, weight: 73.5, note: "Water flush. Waist down 2–3 cm; upper abs firm when you flex." }
    - { date: 2027-01-07, weight: 71.5, note: "The shoulder cap starts to separate from the triceps. Top two abs and the midline show in morning light." }
    - { date: 2027-02-04, weight: 69.5, note: "The upper chest line sharpens under the collarbone; mid abs show through the day." }
    - { date: 2027-02-25, weight: 68.5, note: "Lower abs and the V-cut at the hips lock in." }

# One per day on the habit wall. counts: false means it doesn't add to the weekly target.
activities:
  - { id: strength, label: Strength (gym), short: Gym, color: work, counts: true }
  - { id: pilates, label: Reformer Pilates, short: Pilates, color: cool, counts: true }
  - { id: swim, label: Swim and spa, short: Swim, color: rest, counts: true }
  - { id: cardio, label: Cardio or cycle, short: Cardio, color: ready, counts: true }
  - { id: rest, label: Rest day, short: Rest, color: muted, counts: false }

routines:
  - id: upper
    name: Upper strength
    tab: Upper
    summary: Chest- and back-supported machines only, so your spine never holds the load.
    warning:
      title: Spine and neck rules
      points:
        - "Chest or back stays on the pad for every rep. If you have to swing, the weight is too heavy."
        - "Chin tucked, eyes forward. Never pull behind your neck or look up."
        - "Exhale on the effort and keep your ribs down: no arching off the backrest."
    exercises:
      - key: machine-row
        name: Chest-supported machine row
        target: 3 × 10
        cue: "Sternum glued to the chest pad, chin tucked, no swinging."
        why: "The pad carries your upper body, so the discs at L4–S1 take no shear while your back muscles work. Pulling the shoulders back also opens up the chest."
      - key: incline-press
        name: 30° incline machine chest press
        target: 3 × 10
        cue: "Handles level with your upper sternum. Drive your inner elbows together and squeeze one second at the top."
        why: "The incline works the upper (clavicular) chest that fills the line under the collarbone; a flat press mostly builds the middle and lower chest. Lower back and head stay on the pad, so the press can't turn into a back arch."
      - key: lat-pulldown
        name: Lat pulldown (neutral grip)
        target: 3 × 10
        cue: "Pull to your collarbone, chin tucked, eyes forward. Never behind the neck."
        why: "Lat width is the top of the V-taper. Pulling to the front keeps your neck neutral; behind-the-neck pulls force the head forward and load the facet joints."
      - key: lateral-raise
        name: Cable or machine lateral raise
        target: 3 × 12–15
        cue: "Sweep your hands out toward the walls, not up. Stop at shoulder height. Shoulders down, away from your ears."
        why: "The side delt caps the shoulder and makes the waist look narrower. Hold the cable ball or use a wrist cuff instead of gripping hard. If you shrug, the upper traps take over and pinch the neck, so drop the weight."
      - key: triceps-pushdown
        name: "Superset A: rope triceps pushdown"
        target: 3 × 12, then straight to B
        cue: "Elbows pinned to your ribs. Spread the rope at the bottom, then 3 seconds back up."
        why: "The triceps are most of the upper arm, and spreading the rope works the outer (lateral) head that makes the horseshoe. Stand with soft knees and a rigid neutral spine; if your back complains, stand closer and go lighter rather than leaning in."
      - key: incline-curl
        name: "Superset B: seated incline dumbbell curl"
        target: 3 × 10, 60 s rest after the pair
        cue: "Bench at 60–75°, back and head on the pad. Arms hang straight, turn your palms out as you curl, elbows stay back."
        why: "The bench stops you swinging your torso or arching your back to lift the weight, so the biceps do all the work. The machine preacher curl works too."
      - key: rkc-plank
        name: RKC plank
        target: 3 × 20 s, all-out tension
        cue: "Squeeze your glutes as hard as you can, pull your elbows toward your toes, kneecaps up. Look at the floor."
        weightLabel: Added
        repsLabel: Seconds
        why: "Maximum ab tension with the spine flat and still: rectus abdominis work with no bending. Eyes on the floor keeps the neck neutral. Short and shaking beats long and sagging."
      - key: incline-walk
        name: Incline treadmill walk
        target: 20 min · 4% · 5.2 km/h
        cue: "Hands off the rails, chest proud, chin tucked. Look straight ahead."
        weightLabel: Incline
        weightUnit: "%"
        repsLabel: Minutes
        why: "Walking uphill burns fat with no impact or twisting. Holding the rails takes the work away; looking down or up at a screen strains the neck."

  - id: lower
    name: Lower strength
    tab: Lower
    summary: Zero load down the spine. Pelvis stays locked and your deep core braces every rep.
    warning:
      title: Lower back rules
      points:
        - "Leg press: stop before your tailbone curls off the seat. That curl is loaded spinal flexion."
        - "Grip the handles and keep your pelvis pinned on every seated machine."
        - "Brace gently (navel to spine) and breathe. Never hold your breath and strain."
    exercises:
      - key: leg-press
        name: 45° or horizontal leg press
        target: 3 × 10–12
        cue: "Feet high and wide. Stop before your tailbone lifts off the seat!"
        critical: true
        why: "If the pelvis tucks at the bottom, the lumbar spine bends under the whole sled's weight. Stopping short keeps L4–S1 neutral."
      - key: leg-curl
        name: Seated leg curl
        target: 3 × 10–12
        cue: "Thigh pad locked tight, grip the handles, feel the hamstrings."
        why: "Seated with the pad locked, the pelvis can't tilt, so the hamstrings work without tugging on your lower back."
      - key: hip-abductor
        name: Seated hip abductor
        target: 3 × 12–15
        cue: "Sit tall, pause at the widest point."
        why: "Glute medius steadies the pelvis when you walk and stand, which takes side-to-side load off the lower discs."
      - key: leg-extension
        name: Seated leg extension
        target: 3 × 10–12
        cue: "Lower for three seconds. Back stays against the pad."
        why: "Builds the quads with no spinal load at all, as long as your back stays on the pad."
      - key: suitcase-carry
        name: Single-arm suitcase carry
        target: 3 × 20 m each side
        cue: "Dumbbell in one hand, walk slowly, don't lean."
        repsLabel: Metres each side
        why: "Resisting the side-bend trains the obliques and quadratus lumborum that brace your spine, with no twisting."
      - key: knee-raise
        name: Back-supported knee raise (stop at 90°)
        target: 3 × 10–12, 3 s down
        cue: "Back flat on the pad. Exhale, knees up to hip height. Stop at 90°, never curl your pelvis up."
        critical: true
        weightLabel: Added
        why: "Lifting only to 90° keeps the lower back from rounding. The hip flexors still pull hard on L4–S1, so stop at the first twinge in your back or leg and swap it for a dead bug. Lower for three seconds."
      - key: cardio
        name: Recumbent bike or incline walk
        target: 25 min
        cue: "Seated upright or walking hands-free. Chin tucked, eyes ahead."
        weightLabel: Level
        weightUnit: ""
        repsLabel: Minutes
        why: "Going from 15 to 25 minutes burns roughly another 100 calories a session, with no load on the spine. The recumbent bike's backrest supports the lower back."

flexMix:
  title: Weekend flex mix
  summary: "Saturday has a job: burn about 250 active calories with zero spine stress. Pick from these."
  cards:
    - id: saturday-burn
      name: Saturday burn (45 min)
      summary: 25 min steady cardio, then 20 min swim and spa.
      points:
        - "Cardio: incline walk, brisk treadmill or a seated cycle class, high handlebars, sitting upright."
        - "Swim: long breaststroke glide or backstroke, then the heated spa."
    - id: light-machines
      name: Light machines
      summary: Pick 3 supported machines, 2 gentle sets each.
      points:
        - "Choose from your upper and lower lists: anything with a pad or backrest."
        - "Leave 4 or 5 reps in the tank (RPE 5 to 6)."
    - id: incline-walk
      name: Incline treadmill walk
      summary: Incline 4–5%, 5.0–5.3 km/h, hands free.
      points:
        - "Don't hold the rails. Let your arms swing."
        - "Look straight ahead, not down at your phone or up at a screen."
    - id: cycle-class
      name: Cycle class mode
      summary: Handlebars as high and close as they go, 100% seated.
      points:
        - "No standing climbs and no sprints out of the saddle."
        - "Chin tucked. Don't crane your neck up at the instructor's screen."
    - id: swim
      name: Hydrotherapy and swim
      summary: Breaststroke with a long glide, or backstroke floating.
      points:
        - "Breathe with your face turning, not lifting: keep your neck long along the water."
        - "Spa and warm-water walking count too."
